plugins {
    id 'java'
    id 'com.gradleup.shadow' version '9.0.0-beta4'
}

group = 'sh.joey'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
    maven {
        name = 'papermc'
        url = 'https://repo.papermc.io/repository/maven-public/'
    }
    maven {
        name = 'bluecolored'
        url = 'https://repo.bluecolored.de/releases'
    }
    maven {
        name = 'enginehub'
        url = 'https://maven.enginehub.org/repo/'
    }
    maven {
        name = 'grimac'
        url = 'https://repo.grim.ac/snapshots'
    }
}

dependencies {
    compileOnly 'io.papermc.paper:paper-api:1.21.11-R0.1-SNAPSHOT'
    compileOnly 'com.google.code.gson:gson:2.10.1' // Provided by Paper at runtime
    compileOnly 'de.bluecolored:bluemap-api:2.7.4'
    compileOnly('com.sk89q.worldedit:worldedit-bukkit:7.3.6') {
        exclude group: 'com.google.guava'
        exclude group: 'com.google.code.gson'
        exclude group: 'it.unimi.dsi'
    }
    compileOnly 'ac.grim.grimac:GrimAPI:1.2.3.3' // GrimAC integration (optional)
    implementation 'io.reactivex.rxjava3:rxjava:3.1.12'
    implementation 'com.zaxxer:HikariCP:5.1.0'
    implementation 'org.postgresql:postgresql:42.7.7'
    implementation 'com.maxmind.geoip2:geoip2:5.0.2'

    // Paper API for tests (needed at runtime for Adventure API classes used by PermissibleAttributes)
    testImplementation 'io.papermc.paper:paper-api:1.21.11-R0.1-SNAPSHOT'

    // JUnit 5
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.3'

    // Testcontainers
    testImplementation 'org.testcontainers:testcontainers:1.20.4'
    testImplementation 'org.testcontainers:postgresql:1.20.4'
    testImplementation 'org.testcontainers:junit-jupiter:1.20.4'

    // AssertJ for fluent assertions
    testImplementation 'org.assertj:assertj-core:3.26.3'

    // Mockito for mocking
    testImplementation 'org.mockito:mockito-core:5.14.2'
}

tasks.named('build') {
    dependsOn shadowJar
}

shadowJar {
    archiveClassifier.set('')
    relocate 'io.reactivex.rxjava3', 'sh.joey.mc.shaded.rxjava3'
    relocate 'org.reactivestreams', 'sh.joey.mc.shaded.reactivestreams'
    relocate 'com.zaxxer.hikari', 'sh.joey.mc.shaded.hikari'
    relocate 'com.maxmind', 'sh.joey.mc.shaded.maxmind'
    // PostgreSQL driver uses ServiceLoader - don't relocate
}

// Run only unit tests (exclude integration tests) - this is the default
test {
    useJUnitPlatform {
        excludeTags 'integration'
    }
}

// Run only integration tests (requires Docker)
tasks.register('integrationTest', Test) {
    useJUnitPlatform {
        includeTags 'integration'
    }
    description = 'Runs PostgreSQL integration tests (requires Docker)'
    group = 'verification'
}

// Run all tests (unit + integration, requires Docker)
tasks.register('allTests', Test) {
    useJUnitPlatform()
    description = 'Runs all tests including integration tests (requires Docker)'
    group = 'verification'
}
