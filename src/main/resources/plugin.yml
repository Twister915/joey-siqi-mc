name: JoeySiqi-MC
version: 1.0
main: sh.joey.mc.SiqiJoeyPlugin
description: Joey's custom mods for playing with Siqi
api-version: '1.21'
load: POSTWORLD
author: Joey
softdepend: [BlueMap, FastAsyncWorldEdit, WorldEdit]

commands:
  back:
    description: Return to your death location or previous teleport location
    usage: /back
  tp:
    description: Send a teleport request to another player
    usage: /tp <player>
  tphere:
    description: Request to teleport a player to you
    usage: /tphere <player>
  accept:
    description: Accept a pending confirmation request
    usage: /accept
  decline:
    description: Decline a pending confirmation request
    usage: /decline
  home:
    description: Manage your saved home locations
    usage: /home [set|delete|list|share|unshare] [name] [player]
  ontime:
    description: View your or another player's online time
    usage: /ontime [player]
  daymsgdebug:
    description: Debug command to show all possible contextual day messages
    usage: /daymsgdebug
  world:
    description: Navigate between configured worlds
    usage: /world [name]
  perm:
    description: Manage permissions and groups
    usage: /perm <group|player|reload>
  clear:
    description: Clear your inventory or another player's inventory
    usage: /clear [player]
  ci:
    description: Clear your inventory (alias for /clear)
    usage: /ci [player]
  item:
    description: Give yourself an item
    usage: /item <material> [amount]
  i:
    description: Give yourself an item (alias for /item)
    usage: /i <material> [amount]
  give:
    description: Give a player an item
    usage: /give <player> <material> [amount]
  time:
    description: Set the time in the current world
    usage: /time <day|night|noon|midnight|sunrise|sunset|ticks>
  weather:
    description: Set the weather in the current world
    usage: /weather <clear|rain|thunder>
  list:
    description: List online players
    usage: /list
  warp:
    description: Teleport to a warp point
    usage: /warp [name|set|delete|list]
  spawn:
    description: Teleport to the world spawn point
    usage: /spawn
  setspawn:
    description: Set the spawn point for the current world
    usage: /setspawn
  suicide:
    description: Kill yourself to respawn
    usage: /suicide
  remove:
    description: Remove entities around you
    usage: /remove <type|all> [radius]
  seed:
    description: Show the seed for the current world
    usage: /seed
  uptime:
    description: Show server uptime
    usage: /uptime
  map:
    description: Get a link to the server web map
    usage: /map
  survival:
    description: Teleport to the survival world
    usage: /survival
  creative:
    description: Teleport to the creative world
    usage: /creative
  superflat:
    description: Teleport to the superflat world
    usage: /superflat
  resourcepack:
    description: Manage your resource pack preferences
    usage: /resourcepack [select|clear] [pack]
    aliases: [rp]
  trails:
    description: Manage particle trail effects
    usage: /trails [elytra] [effect] [intensity]
  pet:
    description: Manage your companion pet
    usage: /pet [spawn|despawn|sit|list] [type]
  nick:
    description: Set or clear your display name
    usage: /nick [name|clear] or /nick <player> [name|clear]
  whois:
    description: Look up player information
    usage: /whois <player>
  msg:
    description: Send a private message to another player
    usage: /msg <player> <message>
    aliases: [m, t, tell, whisper, pm, w]
  reply:
    description: Reply to the last private message
    usage: /reply <message>
    aliases: [r]
  adminmode:
    description: Toggle admin creative mode (preserves inventory)
    usage: /adminmode
  genstatue:
    description: Generate a wool statue of a player
    usage: /genstatue <player>
  settings:
    description: Manage your player settings
    usage: /settings [setting] [value]
  ban:
    description: Permanently ban a player
    usage: /ban <player> [reason]
  unban:
    description: Revoke a player's ban
    usage: /unban <player>
  ipban:
    description: Ban an IP address
    usage: /ipban <player|ip> [reason]
  unipban:
    description: Revoke an IP ban
    usage: /unipban <player|ip>
  tempban:
    description: Temporarily ban a player
    usage: /tempban <player> <duration> [reason]
  kick:
    description: Kick a player from the server
    usage: /kick <player> [reason]
  mute:
    description: Permanently mute a player
    usage: /mute <player> [reason]
  unmute:
    description: Revoke a player's mute
    usage: /unmute <player>
  tempmute:
    description: Temporarily mute a player
    usage: /tempmute <player> <duration> [reason]
  warn:
    description: Issue a warning to a player
    usage: /warn <player> <reason>
  punishments:
    description: View punishment history
    usage: /punishments <player> [page]
  invite:
    description: Invite a player to the server whitelist
    usage: /invite <player>
  whitelist:
    description: Manage the server whitelist
    usage: /whitelist <add|remove|list|audit>
  rtp:
    description: Randomly teleport to a new location
    usage: /rtp [select <1-5>]
  pregen:
    description: Control chunk pre-generation
    usage: /pregen [status|start|stop|pause|force|monitor]
  steve:
    description: View Steve AI status
    usage: /steve

permissions:
  smp.*:
    description: All SMP permissions
    default: op
    children:
      smp.rtp: true
      smp.rtp.bypass: true
      smp.pregen: true
      smp.msg: true
      smp.tp: true
      smp.tp.admin: true
      smp.tp.instant: true
      smp.tphere: true
      smp.back: true
      smp.home: true
      smp.ontime: true
      smp.world: true
      smp.clear: true
      smp.clear.others: true
      smp.item: true
      smp.give: true
      smp.time: true
      smp.weather: true
      smp.list: true
      smp.warp: true
      smp.warp.set: true
      smp.spawn: true
      smp.setspawn: true
      smp.suicide: true
      smp.remove: true
      smp.seed: true
      smp.uptime: true
      smp.map: true
      smp.perm.admin: true
      smp.debug: true
      smp.resourcepack: true
      smp.trails.elytra: true
      smp.trails.ghast: true
      smp.trails.walk: true
      smp.pet.hamster: true
      smp.nick: true
      smp.nick.others: true
      smp.whois: true
      smp.whois.admin: true
      smp.adminmode: true
      smp.statue: true
      smp.punish.*: true
      smp.invite: true
      smp.whitelist: true
      smp.settings.keepinventory: true
      smp.settings.displaytime: true
      smp.settings.easymode: true
      smp.steve: true
      smp.steve.admin: true

  smp.tp:
    description: Send teleport requests to other players

  smp.tp.admin:
    description: Instantly teleport to players without sending a request
    default: op

  smp.tp.instant:
    description: Teleport instantly without warmup countdown
    default: op

  smp.tphere:
    description: Request to teleport players to you

  smp.back:
    description: Return to death or previous teleport location

  smp.home:
    description: Use home commands (set, delete, teleport, share)

  smp.ontime:
    description: View online time statistics

  smp.world:
    description: Navigate between configured worlds

  smp.clear:
    description: Clear your own inventory

  smp.clear.others:
    description: Clear other players' inventories
    default: op

  smp.item:
    description: Give yourself items
    default: op

  smp.give:
    description: Give items to other players
    default: op

  smp.time:
    description: Change the time in your current world
    default: op

  smp.weather:
    description: Change the weather in your current world
    default: op

  smp.list:
    description: List online players

  smp.warp:
    description: Teleport to warp points

  smp.warp.set:
    description: Create, update, and delete warp points
    default: op

  smp.spawn:
    description: Teleport to world spawn

  smp.setspawn:
    description: Set the world spawn point
    default: op

  smp.suicide:
    description: Kill yourself to respawn

  smp.remove:
    description: Remove entities around you
    default: op

  smp.seed:
    description: View world seed
    default: op

  smp.uptime:
    description: View server uptime
    default: op

  smp.map:
    description: View the web map link

  smp.perm.admin:
    description: Manage permissions and groups
    default: op

  smp.debug:
    description: Use debug commands
    default: op

  smp.resourcepack:
    description: Manage resource pack preferences

  smp.trails.elytra:
    description: Use elytra particle trail effects
    default: op

  smp.trails.ghast:
    description: Use happy ghast particle trail effects
    default: op

  smp.trails.walk:
    description: Use walking particle trail effects
    default: op

  smp.pet.hamster:
    description: Summon a hamster pet
    default: op

  smp.nick:
    description: Set or clear your own nickname

  smp.nick.others:
    description: Set or clear other players' nicknames
    default: op

  smp.whois:
    description: Look up basic player information

  smp.whois.admin:
    description: Look up detailed player information including IP and history
    default: op

  smp.msg:
    description: Send and receive private messages

  smp.adminmode:
    description: Toggle admin creative mode in survival worlds
    default: op

  smp.statue:
    description: Generate wool statues of players
    default: op

  smp.punish.*:
    description: All punishment permissions
    default: op
    children:
      smp.punish.ban: true
      smp.punish.unban: true
      smp.punish.ipban: true
      smp.punish.unipban: true
      smp.punish.tempban: true
      smp.punish.kick: true
      smp.punish.mute: true
      smp.punish.unmute: true
      smp.punish.tempmute: true
      smp.punish.warn: true
      smp.punish.view: true

  smp.punish.ban:
    description: Permanently ban players
    default: op

  smp.punish.unban:
    description: Revoke player bans
    default: op

  smp.punish.ipban:
