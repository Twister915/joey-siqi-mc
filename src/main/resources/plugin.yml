  smp.punish.unipban:
    description: Revoke IP bans
    default: op

  smp.punish.tempban:
    description: Temporarily ban players
    default: op

  smp.punish.kick:
    description: Kick players from the server
    default: op

  smp.punish.mute:
    description: Permanently mute players
    default: op

  smp.punish.unmute:
    description: Revoke player mutes
    default: op

  smp.punish.tempmute:
    description: Temporarily mute players
    default: op

  smp.punish.warn:
    description: Issue warnings to players
    default: op

  smp.punish.view:
    description: View punishment history
    default: op

  smp.invite:
    description: Invite players to the server whitelist

  smp.whitelist:
    description: Manage the server whitelist (add, remove, list, audit)
    default: op

  smp.rtp:
    description: Use random teleport

  smp.rtp.bypass:
    description: Bypass RTP cooldown
    default: op

  smp.pregen:
    description: Control chunk pre-generation
    default: op

  smp.settings.keepinventory:
    description: Toggle keep inventory on death
    default: op

  smp.settings.displaytime:
    description: Configure time display in boss bar
    default: op

  smp.settings.easymode:
    description: Enable easy mode (reduced damage, insta-kills)
    default: op

  smp.steve:
    description: Ask Steve questions in chat (@Steve)
    default: false
  smp.steve.admin:
    description: View Steve AI status (/steve)
    default: op
