# Server branding - customize for your server
branding:
  # Server name shown in MOTD and other places
  server-name: "Siqi & Joey's Minecraft"
  # Server IP/domain shown in the tab list header
  server-ip: "joey.sh"
  # Tagline shown in the tab list header
  tagline: "Welcome to the server!"

database:
  host: localhost
  port: 5432
  database: minecraft
  username: minecraft
  password: secret
  pool-size: 3
  # Enable to log all SQL queries (for debugging)
  log-queries: false

teleport:
  # How many seconds you must stand still before teleporting
  warmup-seconds: 3
  # How many blocks of movement is tolerated (for accidental inputs)
  movement-tolerance-blocks: 0.5

requests:
  # How long a teleport request stays valid (in seconds)
  timeout-seconds: 60

# Home limits per permission class
# Each entry creates permission smp.home.<name>
# Players without any limit permission have unlimited homes
homes:
  limits:
    # player: 5       # smp.home.player grants 5 homes
    # donor: 12       # smp.home.donor grants 12 homes
    # vip: unlimited  # smp.home.vip grants unlimited homes

# Tips system - sends helpful tips to players every 5 minutes
tips:
  enabled: true

# Protection system - lodestone-based land protection
# Players place lodestones to protect circular regions around them
protection:
  # Number of regions allowed per permission class
  # Each entry creates permission smp.protection.limit.<name>
  # Players without any limit permission have unlimited regions
  limits:
    default: 2       # smp.protection.limit.default grants 2 regions
    vip: 5           # smp.protection.limit.vip grants 5 regions
    # admin: unlimited # smp.protection.limit.admin grants unlimited

  # Maximum radius allowed per permission class
  # Each entry creates permission smp.protection.radius.<name>
  max-radius:
    default: 24      # smp.protection.radius.default allows up to 24 blocks
    vip: 48          # smp.protection.radius.vip allows up to 48 blocks
    admin: 128       # smp.protection.radius.admin allows up to 128 blocks

  # Default radius for new claims
  default-radius: 16
  # Minimum allowed radius
  min-radius: 8

# Random teleport configuration
rtp:
  # Cooldown between RTP uses (in minutes)
  cooldown-minutes: 5
  # Maximum distance from spawn (in blocks)
  search-radius: 25000
  # Minimum distance from spawn (in blocks)
  min-distance: 500
  # Number of candidate locations to generate
  candidate-count: 5
  # How long generated candidates remain valid (in seconds)
  candidate-timeout-seconds: 120
  # Per-candidate timeout for chunk loading (in seconds)
  chunk-timeout-seconds: 3

# Chunk pre-generation (runs when server is empty)
# Generates chunks in a spiral pattern from world spawn outward
# Per-world pregen sizes are configured in the 'worlds' section below using pregen_size
pregen:
  # Enable/disable the pre-generation system
  enabled: false
  # Generation speed: SLOW (1-2/tick), FAST (5-10/tick), FASTEST (20-30/tick)
  rate: FAST
  # How often to log progress (seconds)
  progress-log-interval-seconds: 60

# Custom whitelist system - replaces vanilla whitelist
# When enabled, only whitelisted players can join
# Use /invite or /whitelist add to whitelist players
whitelist:
  enabled: true

# Merit leveling system - weekly challenges and progression
# Players earn Merit by completing challenges and gain levels
merit:
  # Enable/disable the merit system
  enabled: true
  # Base XP for level calculation: merit_for_level(n) = base * n^exponent
  level-base-xp: 100
  # Exponent for level curve (higher = slower progression at high levels)
  level-exponent: 1.8
  # Merit earned for online time
  online-time-reward: 10
  # Minutes of play time required for each reward
  online-time-interval-minutes: 30
  # Maximum merit earnable from online time per week
  online-time-weekly-cap: 500
  # How often to flush progress data to database (seconds)
  flush-interval-seconds: 30
  # Number of weekly challenges assigned to each player
  weekly-challenge-count: 8

# Admin mode configuration
# /adminmode lets admins temporarily enter creative mode while preserving inventory
adminmode:
  # Additional permissions granted while in admin mode
  # Examples: worldedit.*, worldguard.*, smp.tp.instant
  permissions: []

# Steve AI chatbot - Minecraft expert powered by Claude
# Mention @Steve in chat to ask questions about Minecraft
steve:
  # Enable/disable Steve
  enabled: true
  # Which model provider to use (e.g., "anthropic")
  model: anthropic
  # Cooldown between questions per player (seconds)
  # Persisted to database, survives server restarts
  cooldown-seconds: 600

  # Anthropic provider configuration
  anthropic:
    # API key (required - get one at console.anthropic.com)
    api-key: ""
    # Maximum web searches per question (affects cost)
    max-searches: 3

  # LM Studio provider configuration
  # LM Studio exposes an OpenAI-compatible API for local LLMs
  # No cost tracking or web search (local model)
  lmstudio:
    # LM Studio server endpoint (default port is 1234)
    endpoint: "http://localhost:1234"
    # Model identifier from LM Studio (required)
    # Check the "My Models" section in LM Studio for the exact model name
    model: ""

# Multi-world configuration
# Worlds listed here will be created/loaded on startup
# Default Minecraft worlds (world, world_nether, world_the_end) use "default" inventory group
# See doc/multiworld.md for full documentation
worlds:
  # Add default worlds to enable gamemode switching when returning:
  # Overworld with pre-generation (30,000 blocks = 15km radius from spawn)
  # world:
  #   gamemode: SURVIVAL
  #   inventory_group: default
  #   pregen_size: 30000
  #
  # Nether with smaller pre-generation (5,000 blocks = 2.5km radius)
  # world_nether:
  #   gamemode: SURVIVAL
  #   inventory_group: default
  #   hidden: true
  #   pregen_size: 5000
  #
  # End with smaller pre-generation (5,000 blocks = 2.5km radius)
  # world_the_end:
  #   gamemode: SURVIVAL
  #   inventory_group: default
  #   hidden: true
  #   pregen_size: 5000
  #
  # Example creative superflat world with no mobs (no pregen needed):
  # creative:
  #   dimension: overworld
  #   gamemode: CREATIVE
  #   superflat: true
  #   structures: false
  #   generator_settings: '{"layers":[{"block":"minecraft:bedrock","height":1},{"block":"minecraft:dirt","height":2},{"block":"minecraft:grass_block","height":1}],"biome":"minecraft:plains"}'
  #   difficulty: peaceful
  #   game_rules:
  #     doMobSpawning: false
  #     doDaylightCycle: false
  #   inventory_group: creative
  #
  # Example survival world with custom seed (no pregen - world is new):
  # survival2:
  #   seed: 12345
  #   dimension: overworld
  #   gamemode: SURVIVAL
  #   difficulty: hard
  #   inventory_group: survival2
