database:
  host: localhost
  port: 5432
  database: minecraft
  username: minecraft
  password: secret
  pool-size: 3
  # Enable to log all SQL queries (for debugging)
  log-queries: false

teleport:
  # How many seconds you must stand still before teleporting
  warmup-seconds: 3
  # How many blocks of movement is tolerated (for accidental inputs)
  movement-tolerance-blocks: 0.5

requests:
  # How long a teleport request stays valid (in seconds)
  timeout-seconds: 60

# Tips system - sends helpful tips to players every 5 minutes
tips:
  enabled: true

# Random teleport configuration
rtp:
  # Cooldown between RTP uses (in minutes)
  cooldown-minutes: 5
  # Maximum distance from spawn (in blocks)
  search-radius: 25000
  # Minimum distance from spawn (in blocks)
  min-distance: 500
  # Number of candidate locations to generate
  candidate-count: 5
  # How long generated candidates remain valid (in seconds)
  candidate-timeout-seconds: 120
  # Per-candidate timeout for chunk loading (in seconds)
  chunk-timeout-seconds: 3

# Chunk pre-generation (runs when server is empty)
# Generates chunks in a spiral pattern from world spawn outward
pregen:
  # Enable/disable the pre-generation system
  enabled: false
  # Worlds to pre-generate (in order)
  worlds:
    - world
  # Size of area to generate (blocks per side, centered on spawn)
  side-length: 12500
  # Generation speed: SLOW (1-2/tick), FAST (5-10/tick), FASTEST (20-30/tick)
  rate: FAST
  # How often to log progress (seconds)
  progress-log-interval-seconds: 60

# Custom whitelist system - replaces vanilla whitelist
# When enabled, only whitelisted players can join
# Use /invite or /whitelist add to whitelist players
whitelist:
  enabled: true

# Admin mode configuration
# /adminmode lets admins temporarily enter creative mode while preserving inventory
adminmode:
  # Additional permissions granted while in admin mode
  # Examples: worldedit.*, worldguard.*, smp.tp.instant
  permissions: []

# Steve AI chatbot - Minecraft expert powered by Claude
# Mention @Steve in chat to ask questions about Minecraft
steve:
  # Enable/disable Steve
  enabled: true
  # Which model provider to use (e.g., "anthropic")
  model: anthropic
  # Cooldown between questions per player (seconds)
  # Persisted to database, survives server restarts
  cooldown-seconds: 600

  # Anthropic provider configuration
  anthropic:
    # API key (required - get one at console.anthropic.com)
    api-key: ""
    # Maximum web searches per question (affects cost)
    max-searches: 3

  # LM Studio provider configuration
  # LM Studio exposes an OpenAI-compatible API for local LLMs
  # No cost tracking or web search (local model)
  lmstudio:
    # LM Studio server endpoint (default port is 1234)
    endpoint: "http://localhost:1234"
    # Model identifier from LM Studio (required)
    # Check the "My Models" section in LM Studio for the exact model name
    model: ""

# Multi-world configuration
# Worlds listed here will be created/loaded on startup
# Default Minecraft worlds (world, world_nether, world_the_end) use "default" inventory group
# See doc/multiworld.md for full documentation
worlds:
  # Add default worlds to enable gamemode switching when returning:
  # world:
  #   gamemode: SURVIVAL
  #   inventory_group: default
  # world_nether:
  #   gamemode: SURVIVAL
  #   inventory_group: default
  #   hidden: true
  # world_the_end:
  #   gamemode: SURVIVAL
  #   inventory_group: default
  #   hidden: true
  #
  # Example creative superflat world with no mobs:
  # creative:
  #   dimension: overworld
  #   gamemode: CREATIVE
  #   superflat: true
  #   structures: false
  #   generator_settings: '{"layers":[{"block":"minecraft:bedrock","height":1},{"block":"minecraft:dirt","height":2},{"block":"minecraft:grass_block","height":1}],"biome":"minecraft:plains"}'
  #   difficulty: peaceful
  #   game_rules:
  #     doMobSpawning: false
  #     doDaylightCycle: false
  #   inventory_group: creative
  #
  # Example survival world with custom seed:
  # survival2:
  #   seed: 12345
  #   dimension: overworld
  #   gamemode: SURVIVAL
  #   difficulty: hard
  #   inventory_group: survival2
